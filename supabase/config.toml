# Configuración mínima para la CLI de Supabase (supabase link / db push / functions deploy).
# El identificador real del proyecto se indica con: supabase link --project-ref <ref>
project_id = "almacen-bufala"

[db]
major_version = 17

# E-013: los datos de ejemplo (seed.sql) ya no se cargan por defecto. Las pruebas los cargan explícitamente (supabase/tests/pg.ts).
[db.seed]
enabled = false

[auth]
# Nadie se registra por su cuenta: el administrador da de alta a los usuarios (E-004)
enable_signup = false

# "notificar" la llama también pg_cron cada minuto sin sesión de usuario: la propia función comprueba
# la cabecera x-clave-cron o que quien llama es administrador, así que la pasarela no debe exigir JWT.
[functions.notificar]
verify_jwt = false

# E-014: el portal del técnico se abre sin sesión (enlace personal); la función valida el token ella misma.
[functions.portal-tecnico]
verify_jwt = false

# E-012: la llama el Apps Script del wizard (servidor a servidor) con su propio token en X-Integracion, sin sesión de usuario.
[functions.registrar-cierre]
verify_jwt = false
