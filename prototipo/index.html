<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almacén Búfala | Control de stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#F5F7F8; --ink:#15212B; --muted:#586672; --line:#D4DAE0;
  --accent:#1B5FD9; --accent-ink:#FFFFFF; --accent-soft:#E4EDFC;
  --rack:#F4C400; --rack-ink:#161616;
  --red:#C8281C; --red-bg:#FDECEA; --amber:#B86E00; --amber-bg:#FFF3DC; --green:#137A43; --green-bg:#E3F3EA;
  --shadow:0 1px 0 rgba(21,33,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171D; --surface:#18222A; --surface-2:#1F2A33; --ink:#E4EAEF; --muted:#98A6B1; --line:#2C3943;
    --accent:#5B93F5; --accent-ink:#0B1624; --accent-soft:#1D2F4C;
    --red:#FF6B5E; --red-bg:#3A1C1A; --amber:#F5B041; --amber-bg:#3A2C12; --green:#4CC98A; --green-bg:#143325;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171D; --surface:#18222A; --surface-2:#1F2A33; --ink:#E4EAEF; --muted:#98A6B1; --line:#2C3943;
  --accent:#5B93F5; --accent-ink:#0B1624; --accent-soft:#1D2F4C;
  --red:#FF6B5E; --red-bg:#3A1C1A; --amber:#F5B041; --amber-bg:#3A2C12; --green:#4CC98A; --green-bg:#143325;
  --shadow:none; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%}

/* Layout */
.app{min-height:100vh}
@media(min-width:1024px){.app{display:grid;grid-template-columns:236px minmax(0,1fr)}}
.side{display:none}
@media(min-width:1024px){
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--rack);color:var(--rack-ink);display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:20px}
.brand b{display:block;font-size:17px;line-height:1.1}
.brand small{color:var(--muted);font-size:13px}
.snav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;font-weight:500;color:var(--muted);width:100%}
.snav svg{width:20px;height:20px;flex:none}
.snav:hover{background:var(--surface-2);color:var(--ink)}
.snav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.snav .count{margin-left:auto;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:0 7px;line-height:20px}

.main{min-width:0;padding-bottom:96px}
@media(min-width:1024px){.main{padding-bottom:40px}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1280px;margin:0 auto}
@media(min-width:768px){.top-in{padding:14px 28px}}
.top h1{margin:0;font-family:'Barlow Condensed';font-weight:700;font-size:26px;line-height:1;letter-spacing:.01em}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
@media(min-width:768px){.wrap{padding:24px 28px}}

.opsel{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:44px}
.opsel select{border:0;background:transparent;height:42px;max-width:150px;font-weight:600}
.bell{position:relative;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.bell svg{width:22px;height:22px}
.bell .badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.theme-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}

/* Bottom nav (mobile) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
@media(min-width:1024px){.bnav{display:none}}
.bn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;min-height:64px}
.bn svg{width:24px;height:24px}
.bn[aria-current="page"]{color:var(--accent)}
.bn-scan{position:relative;top:-14px}
.bn-scan span.ring{width:66px;height:66px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(27,95,217,.35)}
.bn-scan span.ring svg{width:30px;height:30px}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:17px;font-weight:700}
.card-b{padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07);border-color:var(--accent)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:38px;padding:0 12px;font-size:14px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa-btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:18px;min-height:132px;padding:18px;border-radius:14px;border:0;cursor:pointer;text-align:left;font-weight:700;font-size:20px;line-height:1.15}
.qa-btn svg{width:34px;height:34px}
.qa-scan{background:var(--accent);color:var(--accent-ink)}
.qa-out{background:var(--ink);color:var(--bg)}
@media(min-width:1024px){.qa-btn{min-height:96px;flex-direction:row;align-items:center;justify-content:flex-start;font-size:18px}}

/* Inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px}
textarea.inp{padding:12px 14px;min-height:96px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted)}
.search .inp{padding-left:46px;min-height:54px;font-size:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Signage */
.rack{display:inline-flex;align-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:16px;letter-spacing:.03em;background:var(--rack);color:var(--rack-ink);padding:1px 8px 0;border-radius:3px;line-height:22px;white-space:nowrap;border-left:4px solid var(--rack-ink)}
.rack.lg{font-size:26px;line-height:34px;padding:2px 12px 0;border-left-width:6px}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.st-red{color:var(--red);background:var(--red-bg)}
.st-amber{color:var(--amber);background:var(--amber-bg)}
.st-green{color:var(--green);background:var(--green-bg)}
.stripe{width:6px;align-self:stretch;border-radius:3px}
:root[data-theme="dark"] .stripe,:root:not([data-theme="light"]) .stripe{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

/* Alert band */
.alert-band{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;cursor:pointer;background:var(--red);color:#fff;padding:12px 16px;font-weight:600}
.alert-band svg{width:22px;height:22px;flex:none}
.alert-band .pulse{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media (prefers-reduced-motion: reduce){.alert-band .pulse{animation:none}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:1024px){.kpis{grid-template-columns:1.6fr 1fr 1fr 1fr}}
.kpi{padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:'Barlow Condensed';font-weight:700;font-size:34px;line-height:1.05}
.kpi .l{font-size:14px;color:var(--muted);font-weight:600}
.kpi-main{grid-column:1/-1}
@media(min-width:1024px){.kpi-main{grid-column:auto}}
.kpi-main .v{font-size:44px}

/* Bars */
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:130px minmax(0,1fr) 92px;gap:12px;align-items:center}
@media(max-width:520px){.bar-row{grid-template-columns:1fr auto}.bar-row .track{grid-column:1/-1;order:3}}
.track{height:26px;background:var(--surface-2);border-radius:5px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:5px;transition:width .5s ease}
@media (prefers-reduced-motion: reduce){.fill{transition:none}}

/* Product list */
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--surface-2)}
.prow .nm{font-weight:600;line-height:1.25}
.prow .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.prow .sku{font-size:13px;color:var(--muted)}
.prow .qty{text-align:right}
.prow .qty b{font-family:'Barlow Condensed';font-size:26px;line-height:1;display:block}
.prow .qty span{font-size:13px;color:var(--muted)}
.phead{display:none}
@media(min-width:900px){
  .prow{grid-template-columns:6px minmax(0,2.4fr) 130px 120px 110px 110px}
  .prow .meta .rack,.prow .meta .st{display:none}
  .prow .c-loc,.prow .c-st,.prow .c-val{display:block}
  .phead{display:grid;grid-template-columns:6px minmax(0,2.4fr) 130px 120px 110px 110px;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
}
.c-loc,.c-st,.c-val{display:none}
.c-val{text-align:right;font-weight:600}

/* Movements */
.mrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700}
.mic svg{width:20px;height:20px}
.m-in{background:var(--green-bg);color:var(--green)}
.m-out{background:var(--accent-soft);color:var(--accent)}
.m-loss{background:var(--red-bg);color:var(--red)}
.mq{font-family:'Barlow Condensed';font-weight:700;font-size:22px;text-align:right;white-space:nowrap}
.day-h{padding:10px 16px;background:var(--surface-2);font-size:14px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:12px;border:1px solid var(--line)}
.seg button{min-height:52px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:16px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[aria-pressed="true"][data-t="entrada"]{background:var(--green);color:#fff}
.seg button[aria-pressed="true"][data-t="salida"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"][data-t="merma"]{background:var(--red);color:#fff}

/* Stepper */
.stepper{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:8px}
.stepper button{min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:32px;font-weight:700;cursor:pointer}
.stepper input{min-height:72px;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{min-height:44px;padding:0 14px;border-radius:10px;border:1px dashed var(--line);background:var(--surface);font-weight:600;cursor:pointer}

/* Sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,16,22,.5);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@media(min-width:768px){.overlay{align-items:center}.sheet{max-width:600px;border-radius:16px;padding:8px 24px 24px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0;font-size:21px;line-height:1.2}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kv dt{font-size:13px;color:var(--muted);font-weight:600}
.kv dd{margin:2px 0 0;font-weight:700}
.sn-list{display:flex;flex-direction:column;gap:6px}
.sn{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600}
.sn input{width:22px;height:22px;accent-color:var(--accent)}

/* Scanner */
.cam{position:relative;background:#0A0F14;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-height:58vh;display:grid;place-items:center}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18% 14%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .laser{position:absolute;left:16%;right:16%;top:50%;height:2px;background:#FF3B30;box-shadow:0 0 12px #FF3B30;animation:scanl 2s ease-in-out infinite}
@keyframes scanl{0%,100%{transform:translateY(-60px)}50%{transform:translateY(60px)}}
@media (prefers-reduced-motion: reduce){.cam .laser{animation:none}}
.cam .idle{color:#C9D3DB;text-align:center;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.cam .idle svg{width:52px;height:52px}

/* Albaranes */
.drop{border:2px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:44px;height:44px;color:var(--accent)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px;font-weight:600}
.step .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);flex:none}
.step.done .ic{background:var(--green);border-color:var(--green);color:#fff}
.step.run .ic{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.step.wait{color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px}
.ai-real{background:var(--green-bg);color:var(--green)}
.ai-sim{background:var(--amber-bg);color:var(--amber)}
.lrow{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.off{opacity:.55}
.lrow input[type=checkbox]{width:24px;height:24px;margin-top:2px;accent-color:var(--accent)}
.lgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
@media(min-width:700px){.lgrid{grid-template-columns:minmax(0,2fr) 140px}}
.conf{font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px}
.preview{max-height:220px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:var(--surface-2)}

/* Toast */
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;width:min(92vw,460px)}
@media(min-width:1024px){.toasts{bottom:24px;left:auto;right:24px;transform:none}}
.toast{background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;animation:up .2s ease}
.toast.err{background:var(--red);color:#fff}
.toast.warn{background:var(--amber);color:#1a1300}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.grid-2{display:grid;gap:16px}
@media(min-width:1024px){.grid-2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide-lg{display:initial}
@media(min-width:1024px){.hide-lg{display:none !important}}
.show-md{display:none}
@media(min-width:768px){.show-md{display:initial}}
.scroll-x{overflow-x:auto}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <div class="top-in">
        <div class="hide-lg brand-mark" aria-hidden="true">B</div>
        <h1 id="vtitle">Panel</h1>
        <div style="margin-left:auto" class="row">
          <div class="opsel show-md" title="Operario activo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <label class="sr" for="opSel">Operario</label>
            <select id="opSel" data-in="operator"></select>
          </div>

function status(p){ if(p.stock < p.min) return 'red'; if(p.stock < p.min*1.5) return 'amber'; return 'green'; }
const ST_LABEL = {red:'Crítico', amber:'Bajo', green:'Correcto'};

const num = n => new Intl.NumberFormat('es-ES',{maximumFractionDigits:2}).format(n);

const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const critical = () => state.products.filter(p=>status(p)==='red');
const warning = () => state.products.filter(p=>status(p)==='amber');
const invValue = () => state.products.reduce((a,p)=>a+p.stock*p.price,0);

function applyMovement({sku,type,qty,reason,ref,serials=[]}){
  const p = find(sku); if(!p) throw new Error('Producto no encontrado');
  if(!(qty>0)) throw new Error('Indica una cantidad mayor que cero');
  if(type!=='entrada' && qty>p.stock) throw new Error(`Solo hay ${qtyTxt(p,p.stock)} en stock`);
  const before = status(p);
  if(type==='entrada'){ p.stock += qty; if(p.serialized) p.serials = [...(p.serials||[]), ...serials]; }
  else { p.stock -= qty; if(p.serialized) p.serials = (p.serials||[]).filter(s=>!serials.includes(s)); }
  p.stock = Math.round(p.stock*1000)/1000;
  state.movements.unshift({id:'M'+Date.now()+Math.random().toString(36).slice(2,6), ts:Date.now(), sku, type, qty, reason, ref, operator:state.operator, serials});
  return {p, before, after: status(p)};
}

/* Buscador inteligente: tokens contra nombre, SKU, EAN, ref. proveedor, ubicación, categoría y proveedor */
function searchProducts(q, cat='all', ais='all', onlyAlerts=false){
  const toks = norm(q).split(/\s+/).filter(Boolean);
  return state.products.filter(p=>{
    if(cat!=='all' && p.cat!==cat) return false;
    if(ais!=='all' && aisle(p.loc)!==ais) return false;
    if(onlyAlerts && status(p)==='green') return false;
    if(!toks.length) return true;
    const hay = norm([p.name,p.sku,p.ean,p.supplierRef,p.loc,p.loc.replace(/-/g,' '),CATS[p.cat].label,p.supplier,(p.serials||[]).join(' ')].join(' '));
    return toks.every(t=>hay.includes(t) || (t.endsWith('s') && hay.includes(t.slice(0,-1))));
  }).sort((a,b)=>({red:0,amber:1,green:2}[status(a)]-({red:0,amber:1,green:2}[status(b)])) || a.loc.localeCompare(b.loc));
}

/* Emparejado de líneas de albarán con el catálogo */
function matchLine(code, desc){
  const c = String(code||'').replace(/\s/g,'');
  if(c){
    const byCode = state.products.find(p=> c===p.sku || c===p.ean || c===p.supplierRef || (p.sku.length>=8 && c.startsWith(p.sku)));
    if(byCode) return {sku:byCode.sku, how:'código'};
  }
  const tk = s => norm(s).replace(/[(),.×x]/g,' ').split(/\s+/).filter(t=>t.length>=2);
  const dt = new Set(tk(desc));
  let best=null, bs=0;
  for(const p of state.products){
    const pt = tk(p.name); const hit = pt.filter(t=>dt.has(t)).length;
    const sc = hit / Math.max(4, Math.min(pt.length, dt.size));
    if(sc>bs){bs=sc;best=p;}
  }
  return bs>=0.5 ? {sku:best.sku, how:'descripción'} : {sku:null, how:null};
}

const parseSN = t => [...new Set(String(t).split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean))];
function commitLabel(p){ const q=shQty(p); const verb={entrada:'Registrar entrada',salida:'Registrar salida',merma:'Registrar merma'}[sh.type]; return q>0?`${verb} de ${qtyTxt(p,q)}`:verb; }

function snBlock(p){
  if(sh.type==='entrada') return `<div class="field" style="margin-bottom:16px"><label for="snin">Números de serie que entran (uno por línea)</label>
    <textarea id="snin" class="inp" data-in="snin" placeholder="PCH74-26-0501">${esc(sh.snIn)}</textarea>
    <span class="tiny muted">Cada cargador se registra con su n.º de serie. Se contarán ${parseSN(sh.snIn).length} unidades.</span></div>`;
  const list = p.serials||[];
  return `<div class="field" style="margin-bottom:16px"><label>Selecciona las unidades por n.º de serie</label>
    <div class="sn-list">${list.length? list.map(s=>`<label class="sn"><input type="checkbox" data-in="snout" value="${esc(s)}" ${sh.snOut.includes(s)?'checked':''}>${esc(s)}</label>`).join('') : '<div class="empty">No quedan unidades en stock.</div>'}</div></div>`;
}
function commitSheet(){
  const p = find(sh.sku);
  const qty = shQty(p);
  let serials = [];
  if(p.serialized){
    serials = sh.type==='entrada' ? parseSN(sh.snIn) : sh.snOut;
    const dup = sh.type==='entrada' ? serials.filter(s=>(p.serials||[]).includes(s)) : [];
    if(dup.length) return toast(`El n.º de serie ${dup[0]} ya está en stock.`,'err');
  }
  try{
    const r = applyMovement({sku:p.sku, type:sh.type, qty, reason:sh.reason, ref:sh.ref.trim(), serials});
    save(); closeOverlay();
    toast(`${ {entrada:'Entrada',salida:'Salida',merma:'Merma'}[sh.type] } registrada: ${qtyTxt(p,qty)} de ${p.name.split(' ').slice(0,4).join(' ')}. Quedan ${qtyTxt(p,p.stock)}.`);
    if(r.after==='red' && r.before!=='red') toast(`Stock crítico: ${p.name} ha bajado del mínimo (${qtyTxt(p,p.min)}). Hay que reponer.`,'err',7000);
    else if(r.after==='amber' && r.before==='green') toast(`Stock bajo: ${p.name} se acerca al mínimo.`,'warn',6000);
    render();
  }catch(e){ toast(e.message,'err'); }
}

/* =========================================================
   7. ESCÁNER QR / CÓDIGO DE BARRAS
   Cámara real (getUserMedia + BarcodeDetector) con entrada manual
   de respaldo. Formato QR de cargadores: BUF:<SKU>|SN:<serie>
   ========================================================= */
let camStream=null, detector=null, scanTimer=null, lastScan=null, camMsg='';
function viewScan(){
  const samples = [
    {code:'BUF:BF-VE-POL74|SN:PCH74-26-0419', label:'QR cargador Policharger (en stock)'},
    {code:'BUF:BF-VE-WBX74|SN:WBX-PP-883201', label:'QR Wallbox nuevo (entrada)'},
    {code:'4006209700985', label:'EAN caja tacos SX 6×30'},
    {code:'7270020010', label:'Código Saltoki cable Cat6'},
  ];
  return `<div class="grid-2">
    <div class="stack">
      <div class="cam" id="cam">
        ${camStream ? `<video id="vid" playsinline muted></video><div class="frame"></div><div class="laser"></div>` :
          `<div class="idle">${I.cam}<div>Apunta al QR o código de barras de la caja, bobina o cargador.</div>
            <button class="btn btn-primary" style="min-height:60px;font-size:18px;padding:0 28px" data-act="camstart">Activar cámara</button>
            ${camMsg?`<div class="small" style="color:#FFB4AB;max-width:360px">${esc(camMsg)}</div>`:''}</div>`}
      </div>
      ${camStream?`<button class="btn" data-act="camstop">Detener cámara</button>`:''}
      <div class="card card-b stack" style="gap:12px">
        <div class="field"><label for="manual">Escribir o pegar el código</label>
          <div class="row" style="flex-wrap:nowrap"><input id="manual" class="inp" inputmode="text" placeholder="SKU, EAN o contenido del QR" autocomplete="off"><button class="btn btn-primary" data-act="manual">Buscar</button></div></div>
        <div class="tiny muted">Códigos de prueba (toca para simular la lectura):</div>
        <div class="quick">${samples.map(s=>`<button data-act="sim" data-code="${esc(s.code)}">${esc(s.label)}</button>`).join('')}</div>
      </div>
    </div>
    <div id="scanRes">${scanResult()}</div>
  </div>`;
}
function scanResult(){
  if(!lastScan) return `<div class="card empty" style="padding:48px 20px">El material leído aparecerá aquí con sus botones de entrada y salida.</div>`;
  const {p, code, serial} = lastScan;
  if(!p) return `<div class="card card-b"><span class="st st-red">Código desconocido</span><p style="margin:12px 0 0">El código <b>${esc(code)}</b> no pertenece a ningún material del catálogo. Revisa la etiqueta o búscalo por nombre en Inventario.</p></div>`;
  const s = status(p); const inStock = serial && (p.serials||[]).includes(serial);
  return `<div class="card">
    <div class="card-b stack" style="gap:12px">
      <div class="row"><span class="st st-${s}">${ST_LABEL[s]}</span><span class="tiny muted">Leído: ${esc(code)}</span></div>
      <h2 style="margin:0;font-size:22px;line-height:1.2">${esc(p.name)}</h2>
      <div class="row"><span class="rack lg">${esc(p.loc)}</span><span style="font-family:'Barlow Condensed';font-weight:700;font-size:30px">${qtyTxt(p,p.stock)}</span><span class="small muted">en stock</span></div>
      ${serial?`<div class="small">N.º serie <b>${esc(serial)}</b>: ${inStock?'está en el almacén.':'no consta en stock, puede darse de entrada.'}</div>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button class="btn" style="min-height:72px;font-size:18px;background:var(--green);border-color:var(--green);color:#fff" data-act="scanmove" data-t="entrada" ${serial&&inStock?'disabled':''}>${I.in} Entrada</button>
        <button class="btn btn-primary" style="min-height:72px;font-size:18px" data-act="scanmove" data-t="salida" ${serial&&!inStock?'disabled':''}>${I.out} Salida</button>
      </div>
      <button class="btn" data-act="scanmove" data-t="merma" ${serial&&!inStock?'disabled':''}>${I.loss} Registrar merma</button>
    </div></div>`;
}
function handleCode(raw){
  const code = String(raw).trim(); if(!code) return;
  let sku=code, serial=null;
  const m = code.match(/^BUF:([^|]+)(?:\|SN:(.+))?$/i);
  if(m){ sku=m[1].trim(); serial=m[2]?.trim()||null; }
  let p = state.products.find(x=>x.sku===sku||x.ean===sku||x.supplierRef===sku);
  if(!p && !m){ p = state.products.find(x=>(x.serials||[]).includes(code)); if(p) serial=code; }
  lastScan = {p, code, serial};
  if(navigator.vibrate) try{navigator.vibrate(p?60:[60,60,60]);}catch(e){}
  const r = document.getElementById('scanRes'); if(r) r.innerHTML = scanResult();
  if(p) toast(`Leído: ${p.name.split(' ').slice(0,4).join(' ')}`); else toast(`Código ${code} no encontrado`,'err');
  if(window.innerWidth<1024) r?.scrollIntoView({behavior:'smooth',block:'start'});
}
async function startCamera(){
  camMsg='';
  if(!navigator.mediaDevices?.getUserMedia){ camMsg='Este navegador no permite usar la cámara aquí. Escribe el código o usa los de prueba.'; return render(); }
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    render();
  }catch(e){ camStream=null; camMsg='No se ha podido abrir la cámara (permiso denegado o no disponible en esta vista). Abre la app en una pestaña propia o usa la entrada manual.'; render(); }
}
function afterScanRender(){
  const v = document.getElementById('vid'); if(!v || !camStream) return;
  v.srcObject = camStream; v.play().catch(()=>{});
  if('BarcodeDetector' in window){
    try{ detector = detector || new BarcodeDetector({formats:['qr_code','ean_13','ean_8','code_128','code_39','upc_a']}); }catch(e){ detector=null; }
  }
  if(!detector){ toast('La lectura automática no está disponible en este navegador. Escribe el código debajo.','warn',6000); return; }
  clearInterval(scanTimer);
  scanTimer = setInterval(async()=>{
    if(!v.videoWidth) return;
    try{ const codes = await detector.detect(v); if(codes.length){ const val=codes[0].rawValue; stopCamera(); render(); handleCode(val); } }catch(e){}
  }, 350);
}
function stopCamera(){ clearInterval(scanTimer); if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }

/* =========================================================
   8. LECTURA DE ALBARANES CON IA
   - Foto (JPG/PNG/WebP): Claude Vision real vía capacidad "sample"
     cuando está disponible en el visor de claude.ai.
   - PDF u otros casos: modo simulado con el mismo flujo.
   ========================================================= */
let ai = {sample:null, images:false, checked:false};
(async()=>{
  try{
    if(window.claude && typeof window.claude.use==='function'){
      const s = await window.claude.use('sample');
      if(s){ ai.sample=s; const lim = await s.limits().catch(()=>null); ai.images = !!lim?.images; }
    }
  }catch(e){}
  ai.checked = true; if(ui.view==='albaranes') render();
})();

const DEMOS = {
  saltoki:{proveedor:'Saltoki Alcobendas', numero:'2.824.560', fecha:'24/04/2026', lineas:[
    {codigo:'8909080510', descripcion:'PNX KIT BORNA DOBLE 16 MM2 MONOFASICO V.E. ESQUEMA 2', cantidad:7, confianza:.97},
    {codigo:'7280040020', descripcion:'KOMMDATA CONECTOR MACHO RJ45 UTP CAT 6 GOLD', cantidad:25, confianza:.98},
    {codigo:'6040615306724', descripcion:'ML CABLE LHA RZ1-K(AS) 3G6MM 0,6/1KV (BOBINA)', cantidad:40, confianza:.94},
    {codigo:'9908000200', descripcion:'BOLSA SALTOKI', cantidad:1, confianza:.99},
  ]},
  ve:{proveedor:'Policharger', numero:'PC-26-0917', fecha:'22/09/2026', lineas:[
    {codigo:'POL-74-T2', descripcion:'Cargador Policharger 7,4 kW monofásico T2 cable 5 m', cantidad:10, confianza:.96,
      series:Array.from({length:10},(_,i)=>`PCH74-26-05${String(i+1).padStart(2,'0')}`)},
    {codigo:'', descripcion:'Cable RZ1-K 3G6 mm² 0,6/1 kV bobina 500 m', cantidad:500, confianza:.82},
    {codigo:'', descripcion:'Taco nylon SX 8x40 caja 100 (10 cajas)', cantidad:1000, confianza:.78, nota:'10 cajas × 100 ud convertidas a unidades'},
  ]},
};
let alb = {stage:'idle', mode:null, steps:[], doc:null, lines:[], file:null, preview:null, error:null};
const STEP_NAMES = ['Leyendo el documento','Detectando líneas de material','Emparejando con el catálogo','Listo para revisar'];

function viewAlb(){
  const aiLive = ai.sample && ai.images;
  const badge = !ai.checked ? '<span class="ai-tag ai-sim">Comprobando IA…</span>' :
    aiLive ? '<span class="ai-tag ai-real">Claude Vision activo para fotos</span>' : '<span class="ai-tag ai-sim">Modo simulado</span>';
  return `<div class="grid-2">
    <div class="stack">
      <div class="card card-b stack" style="gap:14px">
        <div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:18px">Recepción de mercancía</h2>${badge}</div>
        <p class="small muted" style="margin:0">Haz una foto al albarán en papel o sube el PDF. La IA extrae códigos, cantidades y números de serie, y los empareja con el catálogo. Tú revisas y apruebas la entrada.</p>
        <label class="drop" id="drop" for="fileIn" tabindex="0">${I.upload}<b>Hacer foto o subir albarán</b><span class="tiny muted">JPG, PNG o PDF. También puedes arrastrarlo aquí.</span></label>
        <div class="tiny muted">¿Sin albarán a mano? Prueba con uno de ejemplo:</div>
        <div class="quick">
          <button data-act="demo" data-d="saltoki">Albarán Saltoki 2.824.560</button>
          <button data-act="demo" data-d="ve">Entrega de 10 cargadores Policharger</button>
        </div>
        ${!aiLive && ai.checked ? `<p class="tiny muted" style="margin:0">La lectura real con Claude está disponible al abrir esta app publicada en claude.ai con una foto. Aquí el flujo se simula con resultados de ejemplo.</p>`:''}
      </div>
      ${alb.stage!=='idle' ? `<div class="card card-b stack" style="gap:14px">
        ${alb.preview?`<img class="preview" src="${alb.preview}" alt="Vista previa del albarán">`:''}
        ${alb.file?`<div class="small"><b>${esc(alb.file)}</b> ${alb.mode==='ia'?'<span class="ai-tag ai-real">Lectura real</span>':'<span class="ai-tag ai-sim">Simulado</span>'}</div>`:''}
        <div class="steps">${STEP_NAMES.map((n,i)=>{const st=alb.steps[i]||'wait';return `<div class="step ${st}"><span class="ic">${st==='done'?I.check:''}</span>${n}</div>`;}).join('')}</div>
        ${alb.error?`<div class="small" style="color:var(--red)">${esc(alb.error)}</div>`:''}
      </div>`:''}
    </div>
    <div class="stack">
      ${alb.stage==='review' ? reviewBlock() : ''}
      <section class="card"><div class="card-h"><h2>Albaranes registrados</h2></div>
        ${state.albaranes.length ? state.albaranes.map(a=>`<div class="mrow"><span class="mic m-in">${I.doc}</span><div><div style="font-weight:600">${esc(a.proveedor)}, n.º ${esc(a.numero)}</div><div class="tiny muted">${esc(a.fecha)}. ${a.lineas} líneas ingresadas por ${esc(a.operator)}</div></div><div class="tiny muted">${new Date(a.ts).toLocaleDateString('es-ES')}</div></div>`).join('') : '<div class="empty">Aún no se ha ingresado ningún albarán desde aquí.</div>'}
      </section>
    </div>
  </div>`;
}
function reviewBlock(){
  const d = alb.doc; const ok = alb.lines.filter(l=>l.include && l.sku).length;
  return `<section class="card">
    <div class="card-h"><div><h2>Revisar albarán ${esc(d.numero||'')}</h2><div class="tiny muted">${esc(d.proveedor||'Proveedor sin identificar')}${d.fecha?`, ${esc(d.fecha)}`:''}</div></div></div>
    <div>${alb.lines.map((l,i)=>{
      const p = l.sku?find(l.sku):null; const cc = l.confianza>=.9?'st-green':l.confianza>=.75?'st-amber':'st-red';
      return `<div class="lrow ${l.include?'':'off'}">
        <input type="checkbox" data-in="lin" data-i="${i}" ${l.include?'checked':''} aria-label="Incluir línea ${i+1}">
        <div style="min-width:0">
          <div class="row" style="gap:8px"><span class="tiny muted">${esc(l.codigo||'sin código')}</span><span class="conf ${cc}">${Math.round((l.confianza||0)*100)}% confianza</span>${l.how?`<span class="tiny muted">emparejado por ${l.how}</span>`:''}</div>
          <div style="font-weight:600;margin-top:4px">${esc(l.descripcion)}</div>
          ${l.nota?`<div class="tiny muted">${esc(l.nota)}</div>`:''}
          <div class="lgrid">
            <select class="inp" data-in="lsku" data-i="${i}" aria-label="Material del catálogo">
              <option value="">Sin correspondencia (no se ingresa)</option>
              ${state.products.map(x=>`<option value="${esc(x.sku)}" ${x.sku===l.sku?'selected':''}>${esc(x.name)}</option>`).join('')}
            </select>
            <div class="row" style="flex-wrap:nowrap;gap:6px"><input class="inp" data-in="lqty" data-i="${i}" inputmode="decimal" value="${esc(l.cantidad)}" aria-label="Cantidad"><span class="small muted">${p?UNIT[p.unit]:''}</span></div>
          </div>
          ${p?.serialized?`<div class="field" style="margin-top:10px"><label>N.º de serie detectados (${parseSN(l.series).length} de ${l.cantidad})</label><textarea class="inp" data-in="lsn" data-i="${i}" style="min-height:80px">${esc(l.series)}</textarea></div>`:''}
          ${p?`<div class="tiny muted" style="margin-top:6px">Destino <span class="rack" style="font-size:13px;line-height:18px">${esc(p.loc)}</span> · stock ${qtyTxt(p,p.stock)} pasará a ${qtyTxt(p,p.stock+(Number(l.cantidad)||0))}</div>`:''}
        </div></div>`;}).join('')}
    </div>
    <div class="card-b row" style="border-top:1px solid var(--line)">
      <button class="btn" data-act="albcancel">Descartar</button>
      <button class="btn btn-primary" style="flex:1;min-height:56px" data-act="albok" ${ok?'':'disabled'}>Aprobar e ingresar ${ok} ${ok===1?'línea':'líneas'} en stock</button>
    </div>
  </section>`;
}
function setLines(doc, mode){
  alb.doc = {proveedor:doc.proveedor, numero:doc.numero, fecha:doc.fecha};
  alb.lines = (doc.lineas||[]).map(l=>{
    let sku = l.sku && find(l.sku) ? l.sku : null, how = sku?'IA':null;
    if(!sku){ const m = matchLine(l.codigo, l.descripcion); sku=m.sku; how=m.how; }
    return {codigo:l.codigo||'', descripcion:l.descripcion||'', cantidad:Number(l.cantidad)||0, confianza:Number(l.confianza)||.8, sku, how, include:!!sku, series:(l.series||[]).join('\n'), nota:l.nota||''};
  });
  alb.mode = mode;
}
const wait = ms => new Promise(r=>setTimeout(r,ms));
async function runSteps(fromIdx=0){ for(let i=fromIdx;i<3;i++){ alb.steps[i]='run'; render(); await wait(650+Math.random()*450); alb.steps[i]='done'; } }

async function processDemo(key, fileName){
  alb = {stage:'processing', mode:'sim', steps:[], doc:null, lines:[], file:fileName||`Ejemplo: ${DEMOS[key].proveedor} ${DEMOS[key].numero}`, preview:alb.preview, error:null};
  if(!fileName) alb.preview=null;
  await runSteps();
  setLines(DEMOS[key],'sim'); alb.steps[3]='done'; alb.stage='review'; render();
}
async function processFile(file){
  if(!file) return;
  const isImg = /^image\//.test(file.type);
  alb = {stage:'processing', mode:null, steps:[], doc:null, lines:[], file:file.name, preview: isImg?URL.createObjectURL(file):null, error:null};
  if(isImg && ai.sample && ai.images){
    alb.mode='ia'; alb.steps[0]='run'; render();
    const catalog = state.products.map(p=>`${p.sku}${p.supplierRef?' / '+p.supplierRef:''} | ${p.name} | ${UNIT[p.unit]}`).join('\n');
    const prompt = `La imagen es un albarán de entrega de un proveedor de material eléctrico, fontanería y movilidad eléctrica para un almacén en España.
Extrae cada línea de material recibido. Ignora bolsas, portes y embalajes salvo que estén en el catálogo.
Para cada línea: código tal como aparece, descripción, cantidad en la unidad base del catálogo (metros para cables y tubos, unidades para el resto; si pone cajas, multiplica por las unidades de la caja e indícalo en "nota"), números de serie si aparecen, y el SKU del catálogo que corresponde (o null si no hay).
Responde SOLO con JSON con esta forma:
{"proveedor":"","numero":"","fecha":"dd/mm/aaaa","lineas":[{"codigo":"","descripcion":"","cantidad":0,"sku":null,"series":[],"nota":"","confianza":0.9}]}

Catálogo (SKU / ref. proveedor | nombre | unidad):
${catalog}`;
    try{
      const t = setTimeout(()=>{ alb.steps[0]='done'; alb.steps[1]='run'; render(); }, 2500);
      const data = await ai.sample.json(prompt, {images:[file], modelTier:'default', cache:false});
      clearTimeout(t);
      alb.steps[0]='done'; alb.steps[1]='done'; alb.steps[2]='run'; render(); await wait(400);
      setLines(data,'ia'); alb.steps[2]='done'; alb.steps[3]='done'; alb.stage='review'; render();
      if(!alb.lines.length) toast('La IA no ha encontrado líneas de material en la imagen. Prueba con una foto más nítida y de frente.','warn',7000);
      return;
    }catch(e){
      const msg = e?.code==='not_granted' ? 'No se ha autorizado el uso de Claude. Se muestra un resultado simulado.'
        : e?.code==='rate_limited' ? 'Demasiadas lecturas seguidas. Espera un momento. Se muestra un resultado simulado.'
        : 'La lectura con IA ha fallado. Se muestra un resultado simulado.';
      toast(msg,'warn',7000);
    }
  }
  const key = /polich|carg|ve/i.test(file.name) ? 've' : 'saltoki';
  const prev = alb.preview;
  await processDemo(key, file.name); alb.preview = prev; render();
}
function approveAlb(){
  const lines = alb.lines.filter(l=>l.include && l.sku);
  for(const l of lines){
    const p = find(l.sku);
    if(p.serialized){
      const sn = parseSN(l.series);
      if(sn.length !== Number(l.cantidad)) return toast(`${p.name}: hay ${sn.length} n.º de serie para ${l.cantidad} unidades. Corrígelo antes de aprobar.`,'err',7000);
      const dup = sn.find(s=>(p.serials||[]).includes(s)); if(dup) return toast(`El n.º de serie ${dup} ya está en stock.`,'err');
    }
    if(!(Number(l.cantidad)>0)) return toast(`Revisa la cantidad de ${p.name}.`,'err');
  }
  lines.forEach(l=> applyMovement({sku:l.sku, type:'entrada', qty:Number(l.cantidad), reason:'Compra a proveedor', ref:`Alb. ${alb.doc.numero||'s/n'}`, serials: find(l.sku).serialized?parseSN(l.series):[]}));
  state.albaranes.unshift({numero:alb.doc.numero||'s/n', proveedor:alb.doc.proveedor||'Proveedor', fecha:alb.doc.fecha||'', lineas:lines.length, ts:Date.now(), operator:state.operator});
  save();
  toast(`Albarán ${alb.doc.numero||''} ingresado: ${lines.length} ${lines.length===1?'línea':'líneas'} sumadas al stock.`);
  alb = {stage:'idle', mode:null, steps:[], doc:null, lines:[], file:null, preview:null, error:null};
  render();
}

/* =========================================================
   9. EVENTOS
   ========================================================= */
function toast(msg, kind='', ms=4000){
  const el = document.createElement('div'); el.className = 'toast '+kind; el.textContent = msg;
  document.getElementById('toasts').appendChild(el); setTimeout(()=>el.remove(), ms);
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if(!t) { if(e.target.id==='overlay') closeOverlay(); return; }
  const a = t.dataset.act;
  if(a==='nav') nav(t.dataset.v);
  else if(a==='open') openProduct(t.dataset.sku);
  else if(a==='pickopen') openProduct(t.dataset.sku,{type:'salida'});
  else if(a==='pickcat') refreshPicker(t.dataset.c);
  else if(a==='quickout') openPicker();
  else if(a==='close') closeOverlay();
  else if(a==='gocrit'){ ui.onlyAlerts=true; ui.cat='all'; ui.q=''; ui.aisle='all'; nav('stock'); }
  else if(a==='cat'){ ui.cat=t.dataset.c; if(ui.view!=='stock') nav('stock'); else render(); }
  else if(a==='alerts'){ ui.onlyAlerts=!ui.onlyAlerts; render(); }
  else if(a==='movtype'){ ui.movType=t.dataset.t; render(); }
  else if(a==='shtype'){ sh.type=t.dataset.t; sh.reason=REASONS[sh.type][0]; renderSheet(); }
  else if(a==='step'){ const p=find(sh.sku); const stepv = p.unit==='m'?5:1; sh.qty=Math.max(0,(Number(String(sh.qty).replace(',','.'))||0)+stepv*Number(t.dataset.d)); renderSheet(); }
  else if(a==='qset'){ sh.qty=Number(t.dataset.q); renderSheet(); }
  else if(a==='commit') commitSheet();
  else if(a==='camstart') startCamera();
  else if(a==='camstop'){ stopCamera(); render(); }
  else if(a==='sim') handleCode(t.dataset.code);
  else if(a==='manual') handleCode(document.getElementById('manual').value);
  else if(a==='scanmove'){ const s=lastScan; openProduct(s.p.sku,{type:t.dataset.t, serial:s.serial}); }
  else if(a==='demo') processDemo(t.dataset.d);
  else if(a==='albcancel'){ alb={stage:'idle',mode:null,steps:[],doc:null,lines:[],file:null,preview:null,error:null}; render(); }
  else if(a==='albok') approveAlb();
  else if(a==='theme'){ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('almacen-theme',r.dataset.theme);}catch(e){} }
  else if(a==='reset'){ if(confirm('¿Restaurar los datos de ejemplo? Se perderán los movimientos registrados.')){ state=freshState(); save(); lastScan=null; render(); toast('Datos de ejemplo restaurados.'); } }
});
document.addEventListener('input', e=>{
  const t = e.target; const k = t.dataset?.in; if(!k) return;
  if(k==='q'){ ui.q=t.value; const l=document.getElementById('plist'); const res=searchProducts(ui.q,ui.cat,ui.aisle,ui.onlyAlerts); l.innerHTML = res.length?res.map(prow).join(''):`<div class="empty">Ningún material coincide con “${esc(ui.q)}”. Prueba con otra palabra o quita filtros.</div>`; }
  else if(k==='movQ'){ ui.movQ=t.value; const pos=t.selectionStart; render(); const n=document.getElementById('mq'); n.focus(); n.setSelectionRange(pos,pos); }
  else if(k==='pickq'){ pickQ=t.value; refreshPicker(); }
  else if(k==='shqty'){ sh.qty=t.value; document.getElementById('commitBtn').textContent=commitLabel(find(sh.sku)); }
  else if(k==='shref'){ sh.ref=t.value; }
  else if(k==='snin'){ sh.snIn=t.value; document.getElementById('commitBtn').textContent=commitLabel(find(sh.sku)); }
  else if(k==='lqty'){ alb.lines[t.dataset.i].cantidad=t.value; }
  else if(k==='lsn'){ alb.lines[t.dataset.i].series=t.value; }
});
document.addEventListener('change', e=>{
  const t = e.target; const k = t.dataset?.in; if(!k) return;
  if(k==='operator'){ state.operator=t.value; save(); toast(`Operario activo: ${t.value}`); }
  else if(k==='aisle'){ ui.aisle=t.value; render(); }
  else if(k==='shreason'){ sh.reason=t.value; }
  else if(k==='snout'){ sh.snOut = [...document.querySelectorAll('[data-in="snout"]:checked')].map(x=>x.value); document.getElementById('commitBtn').textContent=commitLabel(find(sh.sku)); }
  else if(k==='lin'){ alb.lines[t.dataset.i].include=t.checked; render(); }
  else if(k==='lsku'){ const l=alb.lines[t.dataset.i]; l.sku=t.value||null; l.include=!!l.sku; l.how=l.sku?'revisión manual':null; render(); }
  else if(k==='lqty' || k==='lsn'){ render(); }
});
document.getElementById('fileIn').addEventListener('change', e=>{ const f=e.target.files[0]; e.target.value=''; if(ui.view!=='albaranes') nav('albaranes'); processFile(f); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeOverlay();
  if(e.key==='Enter' && e.target.id==='manual') handleCode(e.target.value);
  if(e.key==='Enter' && e.target.id==='drop') document.getElementById('fileIn').click();
});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev, e=>{
  const d = e.target.closest?.('#drop'); if(!d) return; e.preventDefault();
  if(ev==='dragover') d.classList.add('over'); else d.classList.remove('over');
  if(ev==='drop' && e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
}));
try{ const th=localStorage.getItem('almacen-theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
render();
</script>
